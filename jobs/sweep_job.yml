$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep

display_name: rf_sweep_tuning
experiment_name: us_accidents_training

trial:
  code: ../components/train_model
  command: >
    python train.py
    --train_data ${{inputs.train_data}}
    --val_data ${{inputs.val_data}}
    --test_data ${{inputs.test_data}}
    --output ${{outputs.model_output}}
    --n_estimators ${{search_space.n_estimators}}
    --max_depth ${{search_space.max_depth}}
    --min_samples_split ${{search_space.min_samples_split}}
    --min_samples_leaf ${{search_space.min_samples_leaf}}
  environment:
    image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
    conda_file: ../env/train_conda.yml

inputs:
  train_data:
    type: uri_folder
    path: azureml:us_accidents_train@latest

  val_data:
    type: uri_folder
    path: azureml:us_accidents_val@latest

  test_data:
    type: uri_folder
    path: azureml:us_accidents_test@latest

outputs:
  model_output:
    type: uri_folder

compute: azureml:Project

sampling_algorithm: random

search_space:
  n_estimators:
    type: choice
    values: [200, 300, 400]

  max_depth:
    type: choice
    values: [15, 20, 25]

  min_samples_split:
    type: choice
    values: [2, 5, 10]

  min_samples_leaf:
    type: choice
    values: [1, 2, 4]

objective:
  primary_metric: val_f1_weighted
  goal: maximize

limits:
  max_total_trials: 6
  max_concurrent_trials: 2